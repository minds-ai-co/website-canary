<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tickets – Konzerthaus am Kanal</title>
<!--
  Canary pattern: a ticket shop that renders NOTHING until a consent choice is
  made, where every choice is a form submit that reloads the page, and whose
  content is a dense seat map. A capture that stops at the wall sees only the
  privacy notice; one that clicks but does not wait for the reload sees an
  empty shell. The facts in sites.json are only visible after consent.
-->
<style>
  :root { --ink: #1d1b2e; --muted: #6b6880; --brand: #5b2a86; --line: #e3e0ea; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: #f6f5f9; }
  header { background: var(--brand); color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
  header b { font-size: 18px; letter-spacing: .02em; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px; }
  .event { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 20px 24px; display: grid; grid-template-columns: 1fr auto; gap: 12px; }
  .event h1 { margin: 0 0 4px; font-size: 26px; }
  .event p { margin: 0; color: var(--muted); }
  .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 20px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px 20px; }
  .card h2 { font-size: 16px; margin: 0 0 12px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 8px 0; border-bottom: 1px solid var(--line); }
  td:last-child { text-align: right; font-weight: 600; }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; vertical-align: -1px; }
  .stage { text-align: center; background: #2c2940; color: #fff; border-radius: 4px; padding: 6px; font-size: 12px; letter-spacing: .2em; margin-bottom: 8px; }
  svg { width: 100%; height: auto; display: block; }
  button.buy { background: var(--brand); color: #fff; border: 0; border-radius: 6px; padding: 10px 18px; font-size: 15px; }
  #consent { position: fixed; inset: 0; background: rgba(20, 18, 30, .72); display: flex; align-items: center; justify-content: center; }
  #consent .box { background: #fff; max-width: 560px; border-radius: 10px; padding: 24px 28px; }
  #consent h1 { font-size: 20px; margin: 0 0 10px; }
  #consent p { color: var(--muted); font-size: 14px; }
  #consent form { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  #consent button { border-radius: 6px; padding: 10px 16px; font-size: 14px; border: 1px solid var(--brand); background: #fff; color: var(--brand); }
  #consent button.primary { background: var(--brand); color: #fff; }
</style>
</head>
<body>
<header><b>Konzerthaus am Kanal · Webshop</b><span>Warenkorb (0)</span></header>
<main id="shop"></main>

<template id="wall">
  <div id="cookie-consent" role="dialog" aria-modal="true" aria-labelledby="consent-title">
    <div id="consent"><div class="box">
      <h1 id="consent-title">Privatsphäre-Einstellungen</h1>
      <p>Wir verwenden Cookies und ähnliche Technologien, um diesen Webshop bereitzustellen, Ihre Bestellung zu bearbeiten und unser Angebot zu verbessern. Einige davon sind essenziell, andere helfen uns, die Nutzung auszuwerten. Sie können Ihre Einwilligung jederzeit in der Datenschutzerklärung widerrufen.</p>
      <form method="get">
        <button class="primary" name="consent" value="all">Alle akzeptieren</button>
        <button name="consent" value="essential">Nur essenzielle Cookies</button>
      </form>
    </div></div>
  </div>
</template>

<template id="content">
  <section class="event">
    <div>
      <h1>Nachtfalter-Suite</h1>
      <p>Ensemble Lumen · Samstag, 14. März, 19:30 Uhr · Großer Kanalsaal</p>
    </div>
    <div><button class="buy">Plätze wählen</button></div>
  </section>
  <div class="grid">
    <section class="card">
      <h2>Saalplan – Großer Kanalsaal</h2>
      <div class="stage">BÜHNE</div>
      <svg id="seats" viewBox="0 0 640 360" role="img" aria-label="Saalplan mit freien und belegten Plätzen"></svg>
    </section>
    <section class="card">
      <h2>Preiskategorien</h2>
      <table>
        <tr><td><span class="dot" style="background:#c0392b"></span>Kategorie 1</td><td>58 €</td></tr>
        <tr><td><span class="dot" style="background:#e67e22"></span>Kategorie 2</td><td>41 €</td></tr>
        <tr><td><span class="dot" style="background:#27ae60"></span>Kategorie 3</td><td>27 €</td></tr>
        <tr><td><span class="dot" style="background:#2980b9"></span>U27-Ticket (bis 27 Jahre)</td><td>9 €</td></tr>
      </table>
      <p style="color:var(--muted);font-size:13px;margin-top:12px">Grau markierte Plätze sind bereits vergeben. Rollstuhlplätze auf Anfrage an der Abendkasse.</p>
    </section>
  </div>
</template>

<script>
  const params = new URLSearchParams(location.search)
  if (params.has('consent')) {
    document.cookie = 'canary_consent=' + encodeURIComponent(params.get('consent')) + '; path=/; max-age=86400; SameSite=Lax'
    // Like the shops this imitates: the choice reloads the page.
    location.replace(location.pathname)
  } else if (/(^|; )canary_consent=/.test(document.cookie)) {
    document.getElementById('shop').append(document.getElementById('content').content.cloneNode(true))
    const svg = document.getElementById('seats')
    const colors = ['#c0392b', '#c0392b', '#c0392b', '#e67e22', '#e67e22', '#e67e22', '#e67e22', '#27ae60', '#27ae60', '#27ae60', '#27ae60', '#2980b9']
    let seed = 7
    const random = () => (seed = (seed * 16807) % 2147483647) / 2147483647
    const ns = 'http://www.w3.org/2000/svg'
    for (let row = 0; row < colors.length; row++) {
      const seats = 30 + row * 2
      const width = 600 - (colors.length - row) * 12
      for (let seat = 0; seat < seats; seat++) {
        const circle = document.createElementNS(ns, 'circle')
        circle.setAttribute('cx', String(320 - width / 2 + (seat + 0.5) * width / seats))
        circle.setAttribute('cy', String(20 + row * 28))
        circle.setAttribute('r', '6')
        circle.setAttribute('fill', random() < 0.35 ? '#c9c6d3' : colors[row])
        svg.append(circle)
      }
    }
  } else {
    document.body.append(document.getElementById('wall').content.cloneNode(true))
  }
</script>
</body>
</html>
